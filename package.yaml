name:                mcrypt-tools
version:             2.0.1
github:              "ruzen42/mcrypt"
license:             MIT 
maintainer:          "ruzen@tuta.io"

extra-source-files:
- README.md
- CHANGELOG.md

category:            Cryptography 

description:         Simple tools for sign with liboqs (PQ) 

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
  - random
  - binary
  - bytestring
  - filepath
  - directory
  - blake3
  - ram
  - aeson
  - base64-bytestring
  - cryptonite
  - async
  - text
  c-sources:
  - cbits/oqs_shim.c
  include-dirs:
  - cbits 
  extra-libraries:
  - oqs 

executables:
  mcrypt:
    main:                Main.hs
    source-dirs:         mcrypt
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - mcrypt-tools
    - optparse-applicative
    - base64-bytestring
    - bytestring 
  mkey:
    main:                Main.hs
    source-dirs:         mkey 
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - mcrypt-tools
    - optparse-applicative

