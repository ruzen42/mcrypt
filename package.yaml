name:                mrun-crypt
version:             0.1.0.0
github:              "ruzen42/mrun-crypt"
license:             MIT 
author:              "Jaroslav"
maintainer:          "ruzen@tuta.io"
copyright:           "Jaroslav Mihajlenko"

extra-source-files:
- README.md
- CHANGELOG.md

category:            Crypto

description:         Please see the README on GitHub at <https://github.com/ruzen42/mrun-crypt#readme>

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
  - random
  - binary
  - bytestring
  - filepath
  - directory

executables:
  mcrypt:
    main:                Main.hs
    source-dirs:         mcrypt
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - mrun-crypt
    - optparse-applicative
  mkey:
    main:                Main.hs
    source-dirs:         mkey 
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - mrun-crypt
    - optparse-applicative

tests:
  mrun-crypt-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - mrun-crypt
